# Free-plan Supabase projects pause after ~1 week without activity. This makes one tiny read every day.
# Needs repository secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 * * *" # 08:17 Vietnam time, daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the public stories table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/stories?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" > /dev/null
          echo "Supabase is awake."
